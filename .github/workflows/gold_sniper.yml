# GOLD SNIPER V3 — sab kuch isi ek file mein hai
# Github par file ka naam:  .github/workflows/gold_sniper.yml
name: Gold Sniper Alerts

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping gold runs updating the same state concurrently.
concurrency:
  group: gold-sniper-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Bot chalayein
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
          RISK_PERCENT: ${{ vars.RISK_PERCENT }}
          RR: ${{ vars.RR }}
        run: |
          cat > /tmp/bot.py <<'ENDOFPY'
          import json, math, os, time, urllib.request, urllib.parse
          from datetime import datetime, timezone

          SYM = 'GC=F'
          NAME = 'GOLD (XAUUSD)'
          EF, ES, ET = 9, 200, 200
          SLATR, LB, RR_DEF, TSTOP = 2.5, 8, 2.0, 40
          TPCT = 0.001
          CATCHUP = 48
          STATE = 'state.json'

          TG = os.environ.get('TG_TOKEN', '')
          CH = os.environ.get('TG_CHAT', '')
          BAL = float(os.environ.get('ACCOUNT_BALANCE') or 1000)
          RP = float(os.environ.get('RISK_PERCENT') or 0.5)
          RR = float(os.environ.get('RR') or RR_DEF)


          def get(url):
              r = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return json.loads(urllib.request.urlopen(r, timeout=25).read())


          def send(txt):
              print(txt)
              print()
              if os.environ.get('DRY_RUN') == '1':
                  return True
              if not (TG and CH):
                  print('Telegram credentials missing; delivery failed.')
                  return False
              data = urllib.parse.urlencode({'chat_id': CH, 'text': txt, 'parse_mode': 'HTML',
                                             'disable_web_page_preview': 'true'}).encode()
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen('https://api.telegram.org/bot' + TG + '/sendMessage',
                                                  data=data, timeout=20) as response:
                          result = json.loads(response.read())
                      if not result.get('ok'):
                          raise RuntimeError('Telegram API reported unsuccessful delivery')
                      return True
                  except Exception as e:
                      safe = str(e).replace(TG, '[REDACTED]')
                      print('Telegram delivery failed (try {}/3): {}'.format(attempt, safe))
                      if attempt < 3:
                          time.sleep(5)
              return False


          def ema(v, n):
              r = [None] * len(v)
              if len(v) < n:
                  return r
              k, p = 2 / (n + 1), sum(v[:n]) / n
              r[n - 1] = p
              for i in range(n, len(v)):
                  p = v[i] * k + p * (1 - k)
                  r[i] = p
              return r


          def rma(v, n):
              r = [None] * len(v)
              if len(v) < n:
                  return r
              p = sum(v[:n]) / n
              r[n - 1] = p
              for i in range(n, len(v)):
                  p = (p * (n - 1) + v[i]) / n
                  r[i] = p
              return r


          d = get('https://query1.finance.yahoo.com/v8/finance/chart/' + SYM + '?interval=60m&range=6mo')
          res = d['chart']['result'][0]
          q = res['indicators']['quote'][0]
          B = []
          for i, t in enumerate(res['timestamp']):
              o, h, l, c = q['open'][i], q['high'][i], q['low'][i], q['close'][i]
              if None not in (o, h, l, c) and c > 0:
                  B.append({'t': t, 'o': o, 'h': h, 'l': l, 'c': c})
          while B and B[-1]['t'] + 3600 > time.time():
              B.pop()

          if len(B) < max(ET, ES, EF) + 60:
              raise SystemExit('Insufficient completed gold candles; scan stopped.')

          C = [b['c'] for b in B]
          H = [b['h'] for b in B]
          L = [b['l'] for b in B]
          fE, sE, tE = ema(C, EF), ema(C, ES), ema(C, ET)
          tr = [H[0] - L[0]] + [max(H[i] - L[i], abs(H[i] - C[i - 1]), abs(L[i] - C[i - 1]))
                                for i in range(1, len(C))]
          A = rma(tr, 14)
          gl = [0.0] + [max(C[i] - C[i - 1], 0) for i in range(1, len(C))]
          ls = [0.0] + [max(C[i - 1] - C[i], 0) for i in range(1, len(C))]
          u, dn = rma(gl, 14), rma(ls, 14)
          RSI = [None if (u[i] is None or dn[i] is None) else (100.0 if dn[i] == 0 else 100 - 100 / (1 + u[i] / dn[i]))
                 for i in range(len(C))]

          st = {'last': None, 'trade': None}
          if os.path.exists(STATE):
              try:
                  st = json.load(open(STATE))
              except Exception as e:
                  raise SystemExit('Gold state unreadable; scan stopped: {}'.format(e))
          changed = False
          now = time.time()

          start = 0
          if st.get('last') is None:
              start = len(B) - 1
          else:
              while start < len(B) and B[start]['t'] <= st['last']:
                  start += 1
              if len(B) - start > CATCHUP:
                  start = len(B) - CATCHUP

          print('scanning {} bar(s), newest {}'.format(
              max(0, len(B) - start),
              datetime.fromtimestamp(B[-1]['t'], timezone.utc).strftime('%Y-%m-%d %H:%M')))

          fired = 0
          for i in range(start, len(B)):
              bar, fe, se, te, a, r = B[i], fE[i], sE[i], tE[i], A[i], RSI[i]
              if None in (fe, se, te, a, r) or a <= 0:
                  continue

              t = st.get('trade')
              if t and bar['t'] > t['bar']:
                  hit = None
                  if t['side'] == 1:
                      hit = ('SL', t['sl']) if bar['l'] <= t['sl'] else (('TP', t['tp']) if bar['h'] >= t['tp'] else None)
                  else:
                      hit = ('SL', t['sl']) if bar['h'] >= t['sl'] else (('TP', t['tp']) if bar['l'] <= t['tp'] else None)
                  if not hit and (bar['t'] - t['bar']) / 3600 >= TSTOP:
                      hit = ('TIME', bar['c'])
                  if hit:
                      rr_ = (hit[1] - t['entry']) * t['side'] / t['risk']
                      delivered = send(('✅' if rr_ > 0 else '❌') + ' <b>EXIT ' + hit[0] + '</b>\n' + NAME + ' 1H '
                           + ('LONG' if t['side'] == 1 else 'SHORT')
                           + ' @ <code>{:,.2f}</code>\nResult: <b>{:+.2f}R</b>'.format(hit[1], rr_))
                      if not delivered:
                          raise SystemExit('EXIT alert not delivered; state not advanced.')
                      st['trade'] = None
                      changed = True

              if st.get('trade'):
                  continue

              lo = min(B[k]['l'] for k in range(i - (LB - 1), i + 1))
              hi = max(B[k]['h'] for k in range(i - (LB - 1), i + 1))
              atr_pct = a / bar['c'] * 100
              side = 0
              if (bar['c'] > te and fe > se and lo <= fe * (1 + TPCT) and bar['c'] > fe
                      and bar['c'] > bar['o'] and r > 50 and atr_pct > 0.01):
                  side = 1
              elif (bar['c'] < te and fe < se and hi >= fe * (1 - TPCT) and bar['c'] < fe
                      and bar['c'] < bar['o'] and r < 50 and atr_pct > 0.01):
                  side = -1
              if not side:
                  continue

              risk = a * SLATR
              sl = bar['c'] - side * risk
              tp = bar['c'] + side * risk * RR
              age_h = (now - bar['t']) / 3600

              tgt = BAL * RP / 100
              per = risk * 100
              lots = max(0.01, math.floor((tgt / per) / 0.01) * 0.01)
              lots = round(min(lots, 5.0), 2)
              act = lots * per

              head = '🟢 <b>BUY SIGNAL</b> 🟢' if side == 1 else '🔴 <b>SELL SIGNAL</b> 🔴'
              m = [head, '']
              if age_h > 2:
                  m += ['⚠️ <b>YE SIGNAL ' + '{:.0f}'.format(age_h) + ' GHANTE PURANA HAI</b> — '
                        'price ab bahut alag ho sakta hai. Entry lene se pehle chart dekhein.', '']
              m += ['<b>' + SYM + '</b> · 1H · Gold Sniper V3', '─' * 24,
                    ('▲' if side == 1 else '▼') + ' <b>Entry</b>  <code>{:,.2f}</code>'.format(bar['c']),
                    '🛑 <b>SL</b>     <code>{:,.2f}</code>'.format(sl),
                    '🎯 <b>TP</b>     <code>{:,.2f}</code>'.format(tp),
                    '⚖️ <b>RR</b>     1:{:g}'.format(RR),
                    '📏 <b>Risk</b>   {:,.2f} (2.5×ATR)'.format(risk),
                    '📦 <b>SIZE estimate</b>   <b>{:.2f} lot</b>  → broker contract/lot size verify karein'.format(lots)]
              if tgt / per < 0.01:
                  m.append('⚠️ <b>WARNING:</b> min lot {:.2f} par risk <b>{:.1f}%</b> ({:,.2f}), '
                           'na ki {:g}% ({:,.2f}).'.format(lots, act / BAL * 100, act, RP, tgt))
                  m.append('<i>Safe {:g}% ke liye balance kam se kam {:,.0f} chahiye.</i>'.format(RP, act * 100 / RP if RP > 0 else float('inf')))
              else:
                  m.append('<i>Target {:g}% of {:,.0f} = {:,.2f} → actual {:,.2f} (lot rounding)</i>'
                           .format(RP, BAL, tgt, act))
              m += ['📐 <b>DIST</b>   SL {:,.2f} · TP {:,.2f}'.format(risk, risk * RR),
                    '─' * 24,
                    'RSI {:.1f} · EMA9 {:,.2f} · EMA200 {:,.2f}'.format(r, fe, se),
                    '🕐 {} UTC'.format(datetime.fromtimestamp(bar['t'], timezone.utc).strftime('%Y-%m-%d %H:%M')),
                    '',
                    '<i>Levels futures par. Broker par DIST use karein.</i>',
                    '<i>Verified: 43.7% WR · PF 1.22 · 474 trades</i>']
              if not send('\n'.join(m)):
                  raise SystemExit('ENTRY alert not delivered; state not advanced.')
              st['trade'] = {'side': side, 'entry': bar['c'], 'sl': sl, 'tp': tp, 'risk': risk, 'bar': bar['t']}
              changed = True
              fired += 1
              print('SIGNAL SENT')

          st['last'] = B[-1]['t']
          changed = True
          if not fired:
              print('no new signal')
          if changed:
              json.dump(st, open(STATE, 'w'), indent=1)
              print('state saved')
          ENDOFPY
          python3 /tmp/bot.py

      - name: State save
        run: |
          if [ -f state.json ]; then
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            if ! git diff --staged --quiet; then
              git commit -m "state"
              saved=0
              for attempt in 1 2 3; do
                git pull --rebase --autostash || { echo "State rebase failed; inspect conflict."; exit 1; }
                if git push; then saved=1; break; fi
                echo "State push failed (attempt $attempt/3). Retrying."
              done
              if [ "$saved" -ne 1 ]; then
                echo "Gold state was not saved. Investigate before relying on alerts."
                exit 1
              fi
            fi
          fi
